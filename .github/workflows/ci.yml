name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm ci --no-audit --no-fund
      - run: npm run ci

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/generation-api
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: services/generation-api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format app tests
      - name: Commit Ruff formatting
        working-directory: ${{ github.workspace }}
        run: |
          if git diff --quiet -- services/generation-api; then
            echo "Python files are already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/generation-api
          git commit -m "Format procedural generation service"
          git push
      - run: ruff format --check app tests
      - run: pytest

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --workspace --target wasm32-unknown-unknown

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f infrastructure/docker/docker-compose.yml config --quiet
      - run: docker compose -f infrastructure/docker/docker-compose.yml up -d --wait
      - run: docker compose -f infrastructure/docker/docker-compose.yml ps
      - if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml down --volumes
