name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: music-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed scopes
    runs-on: ${{ fromJSON(vars.SYNAPTIX_MUSIC_RUNNER_LABELS || vars.SYNAPTIX_CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    outputs:
      typescript: ${{ steps.scope.outputs.typescript }}
      python: ${{ steps.scope.outputs.python }}
      rust: ${{ steps.scope.outputs.rust }}
      docker: ${{ steps.scope.outputs.docker }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect affected stacks
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "typescript=true" >> "$GITHUB_OUTPUT"
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > /tmp/synaptix-music-changed.txt

          cat /tmp/synaptix-music-changed.txt

          typescript=false
          python=false
          rust=false
          docker=false

          if grep -Eq '^(apps/|packages/|services/render-worker/|package(-lock)?\.json$|turbo\.json$|tsconfig.*\.json$|\.nvmrc$|\.prettier|eslint|scripts/)' /tmp/synaptix-music-changed.txt; then
            typescript=true
          fi

          if grep -Eq '^(services/generation-api/|services/audio-generation/|\.python-version$)' /tmp/synaptix-music-changed.txt; then
            python=true
          fi

          if grep -Eq '^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|packages/dsp-kernel/synaptix-dsp\.wasm$)' /tmp/synaptix-music-changed.txt; then
            rust=true
          fi

          if grep -Eq '^(infrastructure/|apps/|packages/|services/|crates/|\.env\.example$|.*Dockerfile.*$)' /tmp/synaptix-music-changed.txt; then
            docker=true
          fi

          if grep -Eq '^\.github/workflows/ci\.yml$' /tmp/synaptix-music-changed.txt; then
            typescript=true
            python=true
            rust=true
            docker=true
          fi

          echo "typescript=$typescript" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"

  typescript:
    name: TypeScript
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.typescript == 'true' }}
    runs-on: ${{ fromJSON(vars.SYNAPTIX_MUSIC_RUNNER_LABELS || vars.SYNAPTIX_CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: synaptix_music_test
          POSTGRES_USER: synaptix
          POSTGRES_PASSWORD: synaptix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synaptix -d synaptix_music_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RENDER_WORKER_TEST_DATABASE_URL: postgresql://synaptix:synaptix@localhost:5432/synaptix_music_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm ci --no-audit --no-fund
      - run: npm run ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui --workspace @synaptix/music-studio

  python:
    name: Python
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.python == 'true' }}
    runs-on: ${{ fromJSON(vars.SYNAPTIX_MUSIC_RUNNER_LABELS || vars.SYNAPTIX_CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: services/generation-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: services/generation-api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest

  python-audio:
    name: Python (prototype audio)
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.python == 'true' }}
    runs-on: ${{ fromJSON(vars.SYNAPTIX_MUSIC_RUNNER_LABELS || vars.SYNAPTIX_CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: services/audio-generation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: services/audio-generation/pyproject.toml
      - run: python -m pip install --upgrade pip
      # Tests use a fake generator, so the GPU model stack ([model] extra) isn't installed.
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest

  rust:
    name: Rust
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.rust == 'true' }}
    runs-on: ${{ fromJSON(vars.SYNAPTIX_MUSIC_RUNNER_LABELS || vars.SYNAPTIX_CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --workspace --target wasm32-unknown-unknown
      # The kernel's WebAssembly is checked in so Node and browser builds need no Rust toolchain.
      - name: Checked-in synaptix-dsp.wasm matches the crates
        run: |
          cargo build --release -p synaptix-wasm-bindings --target wasm32-unknown-unknown
          cmp target/wasm32-unknown-unknown/release/synaptix_wasm_bindings.wasm packages/dsp-kernel/synaptix-dsp.wasm \
            || { echo "::error::Rebuild it: npm run build:wasm -w @synaptix/dsp-kernel"; exit 1; }

  docker:
    name: Docker Compose
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.docker == 'true' }}
    runs-on: ${{ fromJSON(vars.SYNAPTIX_MUSIC_RUNNER_LABELS || vars.SYNAPTIX_CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f infrastructure/docker/docker-compose.yml config --quiet
      - run: docker compose -f infrastructure/docker/docker-compose.yml up -d --wait
      - run: docker compose -f infrastructure/docker/docker-compose.yml ps
      - if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml down --volumes
