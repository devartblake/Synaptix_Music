<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07080c">
  <title>Offline · Synaptix Music</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      background: radial-gradient(ellipse at 80% -10%, rgb(109 124 255 / 18%), transparent 45%), #07080c; color: #f4f7fc; }
    main { max-width: 420px; display: grid; gap: 16px; text-align: center; justify-items: center; }
    .mark { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 16px; font-weight: 800; font-size: 24px;
      background: linear-gradient(145deg, #6d7cff, #9b5cff); box-shadow: 0 0 32px rgb(109 124 255 / 35%); }
    h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
    p { margin: 0; color: #98a3b7; line-height: 1.5; }
    a { display: inline-flex; min-height: 44px; align-items: center; padding: 0 20px; border-radius: 999px; color: #0b0d12;
      background: #fff; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 2px solid #8994ff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">S</div>
    <h1>You're offline</h1>
    <p>This page hasn't been saved on this device yet. Your Library still opens offline, with your saved projects and downloaded mixes.</p>
    <a href="/library">Open your Library</a>
  </main>
</body>
</html>
